name: Deploy to GitHub Pages

# 部署时把仓库 Secrets 里的 Supabase 配置注入 index.html 的占位符：
#   SUPABASE_URL       → https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  → anon public key（可公开，配合 RLS 使用）
# 配置入口：仓库 Settings → Secrets and variables → Actions → New repository secret

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注入 Supabase 配置
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_ANON_KEY }}|g" index.html
          if grep -q '__SUPABASE_URL__\|__SUPABASE_ANON_KEY__' index.html; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY 未配置，本次部署为纯本地模式（不影响游玩）"
          else
            echo "Supabase 配置注入成功"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
